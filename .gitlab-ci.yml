# Linux base template for running tests with micromamba as package manager
#
# Uses a docker image where micromamba will be installed.
#

.linux_base_template_micromamba:
  image: ubuntu:latest
  tags:
    - docker
  before_script:
    - df -h
    - apt update
    - apt install -y curl
    - apt install -y bzip2
    - export MAMBA_ROOT_PREFIX=$CI_PROJECT_DIR/micromamba
    - export ENVIRONMENT_DEBUGGING_MICROMAMBA_PATH=$CI_PROJECT_DIR/bin/micromamba
    - mkdir -p $CI_PROJECT_DIR/bin/
    - curl -Ls https://gitlab.com/album-app/plugins/album-package/-/raw/micromamba_installer/micromamba-1.0.0_LINUX_X86_64.tar.bz2?inline=false | tar -xvj -C $CI_PROJECT_DIR/bin/ --strip-components=1 bin/micromamba
    - eval "$($CI_PROJECT_DIR/bin/micromamba shell hook -s posix)"
    - micromamba create -y -n album-environments -c conda-forge python=3.10
    - micromamba activate album-environments
    - pip install .
    - python -V
    - python -c "import shutil; print(shutil.which(\"micromamba\"))"
    - env -0 | sort -z | tr '\0' '\n' | grep -i album
    - pip install coverage
    - pip list
  variables:
    PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip
    CONDA_ENV_NAME: album-environments
    CONDA_PREFIX: /opt/conda
    PREFIX: $CONDA_PREFIX/envs/$CONDA_ENV_NAME
  cache:
    key: one-key-to-rule-them-all-linux
    paths:
      - ${CONDA_PREFIX}/pkgs/*.tar.bz2
      - ${CONDA_PREFIX}/pkgs/urls.txt
      - .cache/pip

# Linux base template for running test with conda as package manager
#
# Uses a docker image where conda is already installed.
#
.linux_base_template_conda:
  image: continuumio/miniconda3:latest
  tags:
    - docker
  before_script:
    - apt update
    - apt install git -y
    - python -V # Print out python version for debugging
    - which python
    - conda create -y --channel=conda-forge -n album-environments python=3.9 pip git
    - conda init bash
    - source ~/.bashrc
    - conda activate album-environments
    - pip install -e .
    - which python
    - conda activate album-environments
    - python -V
    - python -c "import shutil; print(shutil.which(\"conda\"))"
    - env -0 | sort -z | tr '\0' '\n' | grep -i album
    - pip list
    - export ENVIRONMENT_DEBUGGING_CONDA_PATH=$(which mamba)
  variables:
    PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip
    CONDA_ENV_NAME: album-environments
    CONDA_PREFIX: /opt/conda
    PREFIX: $CONDA_PREFIX/envs/$CONDA_ENV_NAME
  cache:
    key: one-key-to-rule-them-all-linux
    paths:
      - ${CONDA_PREFIX}/pkgs/*.tar.bz2
      - ${CONDA_PREFIX}/pkgs/urls.txt
      - .cache/pip

# Linux base template for running test with conda with mamba as package manager
#
# Uses a docker image where conda is already installed.
# Creates a album environment.
#
.linux_base_template_conda_with_mamba:
  image: condaforge/mambaforge:latest
  tags:
    - docker
  before_script:
    - apt update
    - apt install git -y
    - python -V # Print out python version for debugging
    - which python
    - mamba create -y --channel=conda-forge -n album-environments python=3.9
    - source /opt/conda/bin/activate
    - conda activate album-environments
    - pip install .
    - which python
    - python -V
    - python -c "import shutil; print(shutil.which(\"mamba\"))"
    - env -0 | sort -z | tr '\0' '\n' | grep -i album
    - pip list
    - export ENVIRONMENT_DEBUGGING_MAMBA_PATH=$(which mamba)
  variables:
    PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip
    CONDA_ENV_NAME: album-environments
    CONDA_PREFIX: /opt/conda
    PREFIX: $CONDA_PREFIX/envs/$CONDA_ENV_NAME
  cache:
    key: one-key-to-rule-them-all-linux
    paths:
      - ${CONDA_PREFIX}/pkgs/*.tar.bz2
      - ${CONDA_PREFIX}/pkgs/urls.txt
      - .cache/pip

# Macos base template for running tests with micromamba as package manager
#
# Installs micromamba in a fresh tmp directory and activates it.
# DO NOT ALLOW JOBS TO BE RUN IN PARALLEL!
#
.macos_base_template_micromamba:
  tags:
    - macos
    - shell
  before_script:
    - echo "$(uname)"
    - sw_vers
    - tmpdir=$(mktemp -d /tmp/album-environments-test.XXXXXX)
    - echo $tmpdir
    - echo $tmpdir > /tmp/tmpdir
    - export MAMBA_ROOT_PREFIX=$tmpdir/micromamba
    - export ENVIRONMENT_DEBUGGING_MICROMAMBA_PATH=$tmpdir/bin/micromamba
    - mkdir -p $tmpdir/bin/
    - curl -Ls https://gitlab.com/album-app/plugins/album-package/-/raw/micromamba_installer/micromamba-1.0.0_MACOS_X86_64.tar.bz2?inline=false | tar -xvj -C $tmpdir/bin/ --strip-components=1 bin/micromamba
    - eval "$($tmpdir/bin/micromamba shell hook -s posix)"
    - micromamba create -y -n album-environments -c conda-forge python=3.10
    - micromamba activate album-environments
    - pip install --no-cache-dir https://gitlab.com/album-app/album-environments/-/archive/$CI_COMMIT_REF_NAME/album-environments-$CI_COMMIT_REF_NAME.zip
    - python -V
    - python -c "import shutil; print(shutil.which(\"micromamba\"))"
    - env -0 | sort -z | tr '\0' '\n' | grep -i album
    - pip list
  after_script:
    - tmpdir=$(</tmp/tmpdir)
    - echo $tmpdir
    - rm -rf $tmpdir

# Macos base template for running tests with conda with mamba as package manager
#
# Installs miniconda in a fresh tmp directory and activates it.
# DO NOT ALLOW JOBS TO BE RUN IN PARALLEL!
#
.macos_base_template_conda:
  tags:
    - macos
    - shell
  before_script:
    - echo "$(uname)"
    - sw_vers
    - tmpdir=$(mktemp -d /tmp/album-environments-test.XXXXXX)
    - echo $tmpdir
    - echo $tmpdir > /tmp/tmpdir
    - curl https://repo.anaconda.com/miniconda/Miniconda3-latest-MacOSX-x86_64.sh --output $tmpdir/miniconda.sh
    - bash $tmpdir/miniconda.sh -b -p $tmpdir/miniconda
    - export PATH=$PATH:$tmpdir/miniconda/bin/
    - echo $PATH
    - conda create -y --channel=conda-forge -n album-environments python=3.9 pip git
    - source $tmpdir/miniconda/bin/activate
    - conda activate album-environments
    - pip install --no-cache-dir https://gitlab.com/album-app/album-environments/-/archive/$CI_COMMIT_REF_NAME/album-environments-$CI_COMMIT_REF_NAME.zip
    - python -V
    - python -c "import shutil; print(shutil.which(\"conda\"))"
    - env -0 | sort -z | tr '\0' '\n' | grep -i album
    - pip list
    - export ENVIRONMENT_DEBUGGING_CONDA_PATH=$(which conda)
  after_script:
    - tmpdir=$(</tmp/tmpdir)
    - echo $tmpdir
    - rm -rf $tmpdir

# Macos base template for running tests with conda as package manager
#
# Installs miniconda in a fresh tmp directory and activates it.
# DO NOT ALLOW JOBS TO BE RUN IN PARALLEL!
#

.macos_base_template_conda_with_mamba:
  tags:
    - macos
    - shell
  before_script:
    - echo "$(uname)"
    - sw_vers
    - tmpdir=$(mktemp -d /tmp/album-environments-test.XXXXXX)
    - echo $tmpdir
    - echo $tmpdir > /tmp/tmpdir
    - curl -fsSLo $tmpdir/mambaforge.sh https://github.com/conda-forge/miniforge/releases/latest/download/Mambaforge-MacOSX-x86_64.sh
    - bash $tmpdir/mambaforge.sh -b -p $tmpdir/mambaforge
    - export PATH=$PATH:$tmpdir/mambaforge/bin/
    - echo $PATH
    - source "$tmpdir/mambaforge/etc/profile.d/mamba.sh"
    - source "$tmpdir/mambaforge/etc/profile.d/conda.sh"
    - conda activate
    - mamba create -y --channel=conda-forge -n album-environments python=3.9 pip git
    - mamba activate album-environments
    - pip install --no-cache-dir https://gitlab.com/album-app/album-environments/-/archive/$CI_COMMIT_REF_NAME/album-environments-$CI_COMMIT_REF_NAME.zip
    - python -V
    - python -c "import shutil; print(shutil.which(\"mamba\"))"
    - env -0 | sort -z | tr '\0' '\n' | grep -i album
    - pip list
    - export ENVIRONMENT_DEBUGGING_MAMBA_PATH=$(which mamba)
  after_script:
    - tmpdir=$(</tmp/tmpdir)
    - echo $tmpdir
    - rm -rf $tmpdir

#----------------------------
# stages
#----------------------------

stages:
  - test
  - release
  - deploy
  - post-deploy

#----------------------------
# jobs
#----------------------------

prepare release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  tags:
    - docker
  script:
    - echo "preparing release"
    - VERSION=$(cat setup.cfg | grep "version=*" | awk '{split($0, s, " "); print s[3]}')
    - TAG=v$VERSION
    - echo "prepare to release version $VERSION with tag $TAG"
    - echo "VERSION=$VERSION" >> variables.env
    - echo "TAG=v$VERSION" >> variables.env
  artifacts:
    reports:
      dotenv: variables.env
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - setup.cfg

gitlab release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  tags:
    - docker
  needs:
    - job: prepare release
      artifacts: true
  script:
    - echo "running release_job for version $VERSION and tag $TAG"
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - setup.cfg
  release:
    name: "Release $TAG"
    description: "Created using the release-cli"
    tag_name: "$TAG"
    ref: "$CI_COMMIT_SHA"

gitlab pypi deploy:
  image: python:latest
  stage: deploy
  tags:
    - docker
  needs:
    - job: gitlab release
    - job: prepare release
      artifacts: true
  script:
    - echo "deploying gitlab pypi version $VERSION"
    - pip install twine
    - python setup.py sdist bdist_wheel
    - TWINE_PASSWORD=${CI_JOB_TOKEN} TWINE_USERNAME=gitlab-ci-token python -m twine upload --repository-url ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi dist/*
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - setup.cfg

pypi deploy:
  image: python:latest
  stage: deploy
  tags:
    - docker
  needs:
    - job: gitlab release
    - job: prepare release
      artifacts: true
  before_script:
    - echo "deploying pypi version $VERSION"
    - echo "using pypi deploy user $PYPI_DEPLOY_USER"
  script:
    - pip install twine
    - python setup.py sdist bdist_wheel
    - TWINE_PASSWORD=$PYPI_DEPLOY_TOKEN TWINE_USERNAME=$PYPI_DEPLOY_USER python -m twine upload --repository-url https://upload.pypi.org/legacy/  dist/*
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - setup.cfg

# Linux Tests

unit tests linux micromamba:
  extends: .linux_base_template_micromamba
  stage: test
  script:
    - coverage run --source=album.environments -m unittest test_album_environments/unit/run_all_unit_micromamba.py
    - coverage report
    - mv .coverage unit.coverage
  artifacts:
    paths:
      - unit.coverage

