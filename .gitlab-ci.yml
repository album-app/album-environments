# CI Routine for the album-environments package.

#----------------------------
# templates
#----------------------------

# Windows base template
#
# Downloads conda executable in <current_working_directory>\downloads if executable not present.
# Installs conda in >current_working_directory>\miniconda if conda not already installed.
# Runs conda initialization and configuration.
#
# NOTE: Apparently there is no output for commands split over several lines...
.windows_base_template_micromamba:
  before_script:
    - 'echo "We are in path: $pwd "'
    - '$7ZIP_EXE=(Join-Path $env:ProgramFiles -ChildPath 7-Zip\7z.exe)'
    - "$7ZIP_INSTALLER=(Join-Path downloads -ChildPath 7z.exe)"
    - "$Env:USERPROFILE=$pwd"
    - "$Env:MAMBA_ROOT_PREFIX=(Join-Path -Path (Get-Location) -ChildPath micromamba_installation)"
    - '$Env:MAMBA_EXE=(Join-Path -Path (Get-Location) -ChildPath micromamba_installation\Library\bin\micromamba.exe)'
    - '$Env:ENVIRONMENT_DEBUGGING_MICROMAMBA_PATH=(Join-Path -Path (Get-Location) -ChildPath micromamba_installation\Library\bin\micromamba.exe)'
    - '$oldProgressPreference = $progressPreference; $progressPreference = "SilentlyContinue";'
    - "[Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12" # set Security download protocol to avoid https errors
    - "if(-Not (Test-Path $7ZIP_EXE)) {if(-Not (Test-Path $7ZIP_INSTALLER)){Invoke-Webrequest -URI https://www.7-zip.org/a/7z2201-x64.exe -OutFile $7ZIP_INSTALLER}}"
    - 'if(-Not (Test-Path $7ZIP_EXE)) {Start-Process -FilePath $7ZIP_INSTALLER -Args "/S" -Verb RunAs -Wait}'
    - "Invoke-Webrequest -URI https://micro.mamba.pm/api/micromamba/win-64/$env:MICROMAMBA_CI_VERSION -OutFile micromamba.tar.bz2"
    - "& $7ZIP_EXE x micromamba.tar.bz2 -aoa"
    - '& $7ZIP_EXE x micromamba.tar -ttar -aoa -r Library\bin\micromamba.exe $("-o" + $Env:MAMBA_ROOT_PREFIX)'
    - "$progressPreference = $oldProgressPreference"
    - '.\micromamba_installation\Library\bin\micromamba.exe create -y -n album -c conda-forge python=$env:TEST_PYTHON_VERSION'
    - '.\micromamba_installation\Library\bin\micromamba.exe --version'
    - 'Write-Output "CI_COMMIT_REF_NAME: $env:CI_COMMIT_REF_NAME"'
    - 'Write-Output "ALBUM_DEV_ENVIRONMENTS: $env:ALBUM_DEV_ENVIRONMENTS"'
    - 'if($env:ALBUM_DEV_ENVIRONMENTS -match "True") { echo "CAUTION! DEV ONLY OPTION ACTIVE. ENABLE/DISABLE BY SETTING ALBUM_DEV_ENVIRONMENTS GITLAB-RUNNER VARIABLE." }'
    - 'if($env:ALBUM_DEV_ENVIRONMENTS -match "True") { .\micromamba_installation\Library\bin\micromamba.exe run -n album pip install git+https://gitlab.com/album-app/album-solution-api.git@dev}'
    - '.\micromamba_installation\Library\bin\micromamba.exe run -n album pip install --no-cache-dir $Env:CI_PROJECT_DIR'
    - '.\micromamba_installation\Library\bin\micromamba.exe run -n album pip install coverage'
    - 'Get-ChildItem Env: | Where-Object { $_.Name -match "album" -or $_.Value -match "album" } | Format-Table -AutoSize'

  tags:
    - windows
    - powershell
  variables:
    PIP_CACHE_DIR: $CI_PROJECT_DIR\.cache\pip
  cache:
    key: one-key-to-rule-them-all-windows
    paths:
      - downloads
      - .cache\pip

# Linux base template for running tests with micromamba as package manager
#
# Uses a docker image where micromamba will be installed.
#

.linux_base_template_micromamba:
  image: ubuntu:latest
  tags:
    - docker
  before_script:
    - df -h
    - apt update || (sleep 30 && apt update) && apt install -y curl bzip2 git
    - export MAMBA_ROOT_PREFIX=$CI_PROJECT_DIR/micromamba
    - mkdir -p $CI_PROJECT_DIR/bin/
    - curl -Ls https://micro.mamba.pm/api/micromamba/linux-64/$MICROMAMBA_CI_VERSION | tar -xvj -C $CI_PROJECT_DIR/bin/ --strip-components=1 bin/micromamba
    - eval "$($CI_PROJECT_DIR/bin/micromamba shell hook -s posix)"
    - micromamba create -y -n album -c conda-forge python=$TEST_PYTHON_VERSION
    - micromamba activate album
    - micromamba --version
    - echo "CI_COMMIT_REF_NAME:$CI_COMMIT_REF_NAME"
    - echo "ALBUM_DEV_ENVIRONMENTS:$ALBUM_DEV_ENVIRONMENTS"
    - if [ "$ALBUM_DEV_ENVIRONMENTS" = "True" ]; then echo "CAUTION! DEV ONLY OPTION ACTIVE. ENABLE/DISABLE BY SETTING ALBUM_DEV_ENVIRONMENTS GITLAB-RUNNER VARIABLE."; fi
    - if [ "$ALBUM_DEV_ENVIRONMENTS" = "True" ]; then pip install git+https://gitlab.com/album-app/album-solution-api.git@dev; fi
    - pip install --no-cache-dir $CI_PROJECT_DIR # should install conda-lock
    - python -V
    - python -c "import shutil; print(shutil.which(\"micromamba\"))"
    - python -c "import shutil; print(shutil.which(\"conda-lock\"))"
    - export ENVIRONMENT_DEBUGGING_MICROMAMBA_PATH=$CI_PROJECT_DIR/bin/micromamba
    - export ENVIRONMENT_CONDA_LOCK_PATH=$(which conda-lock) # explicitly set conda-lock path as it comes as dependenc
    - pip install coverage
    - pip list
    - env -0 | sort -z | tr '\0' '\n' | grep -i album
  variables:
    PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip
  cache:
    key: one-key-to-rule-them-all-linux
    paths:
      - .cache/pip

# Macos base template for running tests with micromamba as package manager
#
# Installs micromamba in a fresh tmp directory and activates it.
# DO NOT ALLOW JOBS TO BE RUN IN PARALLEL!
#
.macos_base_template_micromamba:
  tags:
    - macos
    - shell
  before_script:
    - echo "$(uname)"
    - sw_vers
    - tmpdir=$(mktemp -d /tmp/album-environments-test.XXXXXX)
    - echo $tmpdir
    - echo $tmpdir > /tmp/tmpdir
    - export MAMBA_ROOT_PREFIX=$tmpdir/micromamba
    - export ENVIRONMENT_DEBUGGING_MICROMAMBA_PATH=$tmpdir/bin/micromamba
    - mkdir -p $tmpdir/bin/
    - curl -Ls https://micro.mamba.pm/api/micromamba/osx-64/$MICROMAMBA_CI_VERSION  | tar -xvj -C $tmpdir/bin/ --strip-components=1 bin/micromamba
    - eval "$($tmpdir/bin/micromamba shell hook -s posix)"
    - micromamba create -y -n album python=$TEST_PYTHON_VERSION -c conda-forge
    - micromamba activate album
    - micromamba --version
    - echo "CI_COMMIT_REF_NAME:$CI_COMMIT_REF_NAME"
    - echo "ALBUM_DEV_ENVIRONMENTS:$ALBUM_DEV_ENVIRONMENTS"
    - if [ "$ALBUM_DEV_ENVIRONMENTS" = "True" ]; then echo "CAUTION! DEV ONLY OPTION ACTIVE. ENABLE/DISABLE BY SETTING ALBUM_DEV_ENVIRONMENTS GITLAB-RUNNER VARIABLE."; fi
    - if [ "$ALBUM_DEV_ENVIRONMENTS" = "True" ]; then pip install git+https://gitlab.com/album-app/album-solution-api.git@dev; fi
    - pip install --no-cache-dir $CI_PROJECT_DIR
    - python -V
    - python -c "import shutil; print(shutil.which(\"micromamba\"))"
    - python -c "import shutil; print(shutil.which(\"conda-lock\"))"
    - export ENVIRONMENT_CONDA_LOCK_PATH=$(which conda-lock) # explicitly set conda-lock path as it comes as dependenc
    - pip list
    - env -0 | sort -z | tr '\0' '\n' | grep -i album
  after_script:
    - tmpdir=$(</tmp/tmpdir)
    - echo $tmpdir
    - rm -rf $tmpdir

#----------------------------
# stages
#----------------------------

stages:
  - test
  - release
  - deploy
  - post-deploy

#----------------------------
# jobs
#----------------------------

prepare release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  tags:
    - docker
  script:
    - echo "preparing release"
    - VERSION=$(cat pyproject.toml | grep "version=*" | awk '{gsub(/"/, "", $3); print $3}')
    - TAG=v$VERSION
    - echo "prepare to release version $VERSION with tag $TAG"
    - echo "VERSION=$VERSION" >> variables.env
    - echo "TAG=v$VERSION" >> variables.env
  artifacts:
    reports:
      dotenv: variables.env
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - pyproject.toml

gitlab release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  tags:
    - docker
  needs:
    - job: prepare release
      artifacts: true
  script:
    - echo "running release_job for version $VERSION and tag $TAG"
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - pyproject.toml
  release:
    name: "Release $TAG"
    description: "Created using the release-cli"
    tag_name: "$TAG"
    ref: "$CI_COMMIT_SHA"

gitlab pypi deploy:
  image: python:latest
  stage: deploy
  tags:
    - docker
  needs:
    - job: gitlab release
    - job: prepare release
      artifacts: true
  script:
    - echo "deploying gitlab pypi version $VERSION"
    - pip install twine build
    - python -m build
    - TWINE_PASSWORD=${CI_JOB_TOKEN} TWINE_USERNAME=gitlab-ci-token python -m twine upload --repository-url ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi dist/*
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - pyproject.toml

pypi deploy:
  image: python:latest
  stage: deploy
  tags:
    - docker
  needs:
    - job: gitlab release
    - job: prepare release
      artifacts: true
  before_script:
    - echo "deploying pypi version $VERSION"
    - echo "using pypi deploy user $PYPI_DEPLOY_USER"
  script:
    - pip install twine build
    - python -m build
    - TWINE_PASSWORD=$PYPI_DEPLOY_TOKEN TWINE_USERNAME=$PYPI_DEPLOY_USER python -m twine upload --repository-url https://upload.pypi.org/legacy/  dist/*
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - pyproject.toml

#------
# Linux
#------

# Unittests

linux micromamba unit tests:
  extends: .linux_base_template_micromamba
  stage: test
  script:
    - coverage run --source=album.environments -m unittest test_album_environments/unit/run_all_unit_micromamba.py
    - coverage report
    - mv .coverage unit.coverage
  artifacts:
    paths:
      - unit.coverage

# Integration

linux micromamba integration tests:
  extends: .linux_base_template_micromamba
  stage: test
  script:
    - coverage run --source=album.environments -m unittest test_album_environments/integration/run_all_integration_micromamba.py
    - coverage report
    - mv .coverage integration.coverage
  artifacts:
    paths:
      - integration.coverage

#------
# MacOS
#------

# Unittests

macos micromamba unit tests:
  extends: .macos_base_template_micromamba
  stage: test
  script:
    - python -m unittest test_album_environments/unit/run_all_unit_micromamba.py

# Integration

macos micromamba integration tests:
  extends: .macos_base_template_micromamba
  stage: test
  script:
    - python -m unittest test_album_environments/integration/run_all_integration_micromamba.py

#--------
# Windows
#--------

# Unittests

windows micromamba unit tests:
  extends: .windows_base_template_micromamba
  stage: test
  script:
    - '.\micromamba_installation\Library\bin\micromamba.exe run -n album coverage run -m unittest test_album_environments\unit\run_all_unit_micromamba.py'
    - 'if ($lastexitcode -ne 0) {exit(1)} else { .\micromamba_installation\Library\bin\micromamba.exe run -n album coverage report }'
    - 'if ($lastexitcode -ne 0) {exit(1)} else { .\micromamba_installation\Library\bin\micromamba.exe run -n album coverage xml } '
    - 'Rename-Item -Path ".coverage" -NewName "unit.coverage"'
    - 'Rename-Item -Path "coverage.xml" -NewName "unit_coverage.xml"'
    - "exit($lastexitcode)}"
  artifacts:
    paths:
      - unit.coverage

# Integration

windows micromamba integration tests:
  extends: .windows_base_template_micromamba
  stage: test
  script:
    - '.\micromamba_installation\Library\bin\micromamba.exe run -n album coverage run -m unittest test_album_environments\integration\run_all_integration_micromamba.py'
    - 'if ($lastexitcode -ne 0) {exit(1)} else { .\micromamba_installation\Library\bin\micromamba.exe run -n album coverage report }'
    - 'if ($lastexitcode -ne 0) {exit(1)} else { .\micromamba_installation\Library\bin\micromamba.exe run -n album coverage xml } '
    - 'Rename-Item -Path ".coverage" -NewName "integration.coverage"'
    - 'Rename-Item -Path "coverage.xml" -NewName "integration_coverage.xml"'
    - "exit($lastexitcode)"
  artifacts:
    paths:
      - integration.coverage

#---------
# Coverage
#---------

create combined coverage for linux:
  extends: .linux_base_template_micromamba
  stage: test
  dependencies:
    - linux micromamba unit tests
    - linux micromamba integration tests
  needs:
    - linux micromamba unit tests
    - linux micromamba integration tests
  script:
    - coverage combine unit.coverage integration.coverage
    - coverage report
    - coverage xml
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

create combined coverage for windows:
  extends: .windows_base_template_micromamba
  stage: test
  dependencies:
    - windows micromamba unit tests
    - windows micromamba integration tests
  needs:
    - windows micromamba unit tests
    - windows micromamba integration tests
  script:
    - '.\micromamba_installation\Library\bin\micromamba.exe run -n album coverage combine unit.coverage integration.coverage'
    - '.\micromamba_installation\Library\bin\micromamba.exe run -n album coverage report'
    - '.\micromamba_installation\Library\bin\micromamba.exe run -n album coverage xml'
    - "exit($lastexitcode)"
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
