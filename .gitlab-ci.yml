# Windows Tests

unit tests windows micromamba:
  extends: .windows_base_template_micromamba
  stage: test
  script:
    - '.\micromamba\Library\bin\micromamba.exe run -p .\micromamba\envs\album-environments coverage run --omit .\test_album_environments\* -m unittest test_album_environments\unit\run_all_unit_micromamba.py'
    - 'if ($lastexitcode -ne 0) {exit(1)} else { .\micromamba\Library\bin\micromamba.exe run -p .\micromamba\envs\album-environments coverage report }'
    - 'if ($lastexitcode -ne 0) {exit(1)} else { .\micromamba\Library\bin\micromamba.exe run -p .\micromamba\envs\album-environments coverage xml } '
    - 'Rename-Item -Path ".coverage" -NewName "unit.coverage"'
    - 'Rename-Item -Path "coverage.xml" -NewName "unit_coverage.xml"'
    - "exit($lastexitcode)}"
  artifacts:
    paths:
      - unit.coverage

unit tests windows conda:
  extends: .windows_base_template_conda
  stage: test
  script:
